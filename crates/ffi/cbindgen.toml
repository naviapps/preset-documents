language = "C"
style = "both"
include_guard = "PRESET_DOCUMENTS_H"
header = "// Generated by cbindgen from the Rust FFI sources.\n// clang-format off"
cpp_compat = true
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
usize_is_size_t = true
documentation_style = "c99"
line_endings = "LF"

[export.rename]
Buffer = "PresetDocumentsBuffer"
