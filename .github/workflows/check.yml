name: SDK checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Platform checks to run
        type: choice
        default: all
        options: [all, macos, windows]
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.event_name == 'push' && github.run_id || github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: true
jobs:
  plan:
    uses: naviapps/sdk-tooling/.github/workflows/plan-checks.yml@54d09a55da0ffe938ebd13d708c53a2bd28d6be0
  swift:
    name: Swift
    needs: plan
    if: ${{ needs.plan.outputs.documentation-only != 'true' && inputs.platform != 'windows' }}
    uses: naviapps/sdk-tooling/.github/workflows/check-swift.yml@54d09a55da0ffe938ebd13d708c53a2bd28d6be0
  windows:
    name: Test Rust and .NET
    needs: plan
    if: ${{ needs.plan.outputs.documentation-only != 'true' && inputs.platform != 'macos' }}
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
      - uses: naviapps/sdk-tooling/.github/actions/test-rust-windows@main
        with:
          test-bindings: "true"
